[project]
name = "dynamic-ra"
version = "0.2.0"
description = "Dynamic Regression Adjustment under Randomized Experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy (==1.26.4)",
  "seaborn (>=0.13.2,<0.14.0)",
  "notebook (>=7.4.5,<8.0.0)",
  "pandas (>=2.3.2,<3.0.0)",
  "scikit-learn (<1.7.2)",
  "tqdm (>=4.67.1,<5.0.0)",
  "tabulate (>=0.9.0,<0.10.0)",
  "mlflow (==2.8.1)",
  "hydra-core (>=1.3.2,<2.0.0)",
  "torch (>=2.0.0)",
  "torchvision (>=0.15.0)",
  "torchaudio (>=2.0.0)",
  "memory-profiler (>=0.61.0,<0.62.0)",
  "hmmlearn (>=0.3.3,<0.4.0)",
  "statsmodels (>=0.14.5,<0.15.0)",
  "pyro-ppl (>=1.9.0)",
  "xgboost (<3.1.1)",
  "fsspec (>=2025.10.0,<2026.0.0)",
  "gcsfs (>=2025.10.0,<2026.0.0)",
  "numba (<0.63.1)",
  "lightgbm (>=4.6.0,<5.0.0)",
]

[dependency-groups]
dev = [
  "ruff>=0.6.9",
]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "W", "F", "C", "I"]
ignore = ["E741"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.sphinx-pyproject]
project = "dynamic-ra"
copyright = "2023, naoki"
language = "en"
package_root = "dynamic-ra"
html_theme = "sphinx_rtd_theme"
todo_include_todos = true
templates_path = ["_templates"]
html_static_path = ["_static"]
extensions = [
  "sphinx.ext.autodoc",
  "sphinx.ext.viewcode",
  "sphinx.ext.todo",
  "sphinx.ext.napoleon",
]
