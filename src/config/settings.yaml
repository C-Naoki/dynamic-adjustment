hydra:
  run:
    dir: out/logs/${now:%Y-%m-%d} # /${now:%H-%M-%S}
  sweep:
    dir: out/logs/${now:%Y-%m-%d}/multirun # /${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: False
  job_logging:
    version: 1
    handlers:
      console:
        class: logging.StreamHandler
        stream: ext://sys.stdout
    formatters:
      simple:
        format: '%(message)s'

defaults:
  - _self_
  - model: dynamicra

io:
  input_dir: ???
  out_dir: out/
  root_out_dir: out/

data:
  n: 1000
  T: 7
  d: 10
  K: 2
  x_to_x: 1.0
  x_diag_ratio: 1.0
  x_to_y: 1.0
  x_nonlinear: 0.5
  w_base: 0.0
  w_amp: 0.2
  w_to_x: 0.2
  w_to_y: 1.0
  y_to_x: 0.5
  y_to_y: 0.8
  mu_0: 4.0
  mu_x: 0.0
  mu_y: 0.0
  sigma_0: 0.8
  sigma_x: 0.2
  sigma_y: 0.2
  timestep: 0.01
  lorenz_force: 4.0
  gauss_mean: 4.0
  model_type: nonlinear
  assign_mode: always
  reg_type: gauss_sin
  trans_type: rotated_lorenz
  treat_type: exp
  hard_assign: False

eval:
  n_boot: 1000
  ci_level: 0.95
  variance_type: moment  # [moment, multiplier]
  band_type: pointwise  # [pointwise, uniform]

exp:
  seed: 19
  iterations: 1000
  n_workers: 1

use_gpu: False
use_multi_gpu: False
devices: "0,1,2,3"
save: True
verbose: True
